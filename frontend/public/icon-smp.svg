<!--
  Ilustrasi SMPIT Al-Mubarak — aset orisinal, digambar tangan dalam bahasa
  visual yang sama dengan icon-sd.svg (flat, geometris, palet identitas
  Al-Mubarak: hijau utama #00aa5b, hijau tua #0f3d2e / #008c4a, aksen emas
  #FFC10D, dinding putih). Bedanya jenjang: gedung dua lantai + menara
  menyeruak dan menara kecil di sisi — menandai sekolah lanjutan.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- tanah -->
  <ellipse cx="200" cy="352" rx="168" ry="14" fill="#0f3d2e" opacity="0.14"/>

  <!-- gedung utama dua lantai -->
  <rect x="96" y="168" width="208" height="180" rx="8" fill="#ffffff" stroke="#0f3d2e" stroke-width="6"/>
  <!-- atap datar -->
  <rect x="86" y="150" width="228" height="22" rx="10" fill="#00aa5b"/>

  <!-- menara tengah dengan kubah -->
  <rect x="178" y="96" width="44" height="76" rx="6" fill="#ffffff" stroke="#0f3d2e" stroke-width="6"/>
  <path d="M168 100a32 24 0 0 1 64 0z" fill="#FFC10D"/>
  <rect x="199" y="62" width="2.6" height="16" fill="#008c4a"/>
  <circle cx="200.3" cy="60" r="4" fill="#FFC10D"/>

  <!-- jendela lantai atas -->
  <rect x="118" y="196" width="26" height="34" rx="13" fill="#00aa5b" stroke="#0f3d2e" stroke-width="4"/>
  <rect x="187" y="196" width="26" height="34" rx="13" fill="#00aa5b" stroke="#0f3d2e" stroke-width="4"/>
  <rect x="256" y="196" width="26" height="34" rx="13" fill="#00aa5b" stroke="#0f3d2e" stroke-width="4"/>

  <!-- jendela lantai bawah -->
  <rect x="118" y="264" width="26" height="34" rx="13" fill="#00aa5b" stroke="#0f3d2e" stroke-width="4"/>
  <rect x="256" y="264" width="26" height="34" rx="13" fill="#00aa5b" stroke="#0f3d2e" stroke-width="4"/>

  <!-- pintu -->
  <path d="M182 348v-46a18 18 0 0 1 36 0v46z" fill="#008c4a"/>
  <path d="M182 348v-46a18 18 0 0 1 36 0v46z" fill="none" stroke="#0f3d2e" stroke-width="5"/>

  <!-- bendera kecil di atap -->
  <rect x="300" y="110" width="3" height="44" fill="#0f3d2e"/>
  <path d="M303 112h30l-8 10 8 10h-30z" fill="#FFC10D" stroke="#0f3d2e" stroke-width="3" stroke-linejoin="round"/>

  <!-- semak -->
  <circle cx="76" cy="336" r="18" fill="#00aa5b"/>
  <circle cx="324" cy="336" r="18" fill="#00aa5b"/>
  <rect x="62" y="336" width="28" height="14" fill="#00aa5b"/>
  <rect x="310" y="336" width="28" height="14" fill="#00aa5b"/>
</svg>
