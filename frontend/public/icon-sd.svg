<!--
  Ilustrasi SDIT Al-Mubarak — aset orisinal, digambar tangan dalam bahasa
  visual repo ini (flat, bentuk geometris sederhana, palet identitas
  Al-Mubarak: hijau utama #00aa5b, hijau tua #0f3d2e / #008c4a, aksen emas
  #FFC10D, dinding putih). Konsisten satu gaya dengan icon-smp.svg; tidak
  disalin dari sumber mana pun.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- tanah -->
  <ellipse cx="200" cy="352" rx="168" ry="14" fill="#0f3d2e" opacity="0.14"/>

  <!-- gedung utama -->
  <rect x="80" y="200" width="240" height="148" rx="8" fill="#ffffff" stroke="#0f3d2e" stroke-width="6"/>
  <!-- atap -->
  <path d="M64 208L200 120l136 88z" fill="#00aa5b"/>
  <path d="M64 208L200 120l136 88z" fill="none" stroke="#008c4a" stroke-width="6" stroke-linejoin="round"/>

  <!-- kubah -->
  <path d="M182 124a18 18 0 0 1 36 0z" fill="#FFC10D"/>
  <rect x="199" y="96" width="2.6" height="14" fill="#008c4a"/>
  <circle cx="200.3" cy="94" r="4" fill="#FFC10D"/>

  <!-- pintu -->
  <path d="M182 348v-52a18 18 0 0 1 36 0v52z" fill="#008c4a"/>
  <path d="M182 348v-52a18 18 0 0 1 36 0v52z" fill="none" stroke="#0f3d2e" stroke-width="5"/>

  <!-- jendela kiri -->
  <path d="M112 252a14 14 0 0 1 28 0v30h-28z" fill="#00aa5b"/>
  <path d="M112 252a14 14 0 0 1 28 0v30h-28z" fill="none" stroke="#0f3d2e" stroke-width="4"/>
  <rect x="106" y="284" width="40" height="8" rx="4" fill="#0f3d2e"/>

  <!-- jendela kanan -->
  <path d="M260 252a14 14 0 0 1 28 0v30h-28z" fill="#00aa5b"/>
  <path d="M260 252a14 14 0 0 1 28 0v30h-28z" fill="none" stroke="#0f3d2e" stroke-width="4"/>
  <rect x="254" y="284" width="40" height="8" rx="4" fill="#0f3d2e"/>

  <!-- buku terbuka di bawah atap -->
  <path d="M200 168c-8-7-20-8-28-4v22c8-4 20-3 28 4 8-7 20-8 28-4v-22c-8-4-20-3-28 4z" fill="#FFC10D" stroke="#0f3d2e" stroke-width="4" stroke-linejoin="round"/>
  <line x1="200" y1="168" x2="200" y2="190" stroke="#0f3d2e" stroke-width="4"/>

  <!-- semak -->
  <circle cx="60" cy="336" r="18" fill="#00aa5b"/>
  <circle cx="340" cy="336" r="18" fill="#00aa5b"/>
  <rect x="46" y="336" width="28" height="14" fill="#00aa5b"/>
  <rect x="326" y="336" width="28" height="14" fill="#00aa5b"/>
</svg>
